name: UI 自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-test:
    name: Playwright UI 测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # ---------- 依赖服务：MySQL + Redis ----------
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # ---------- 1. 拉取代码 ----------
      - name: 检出测试代码
        uses: actions/checkout@v4
        with:
          path: tests-repo

      - name: 检出 RuoYi 后端（springboot2 分支）
        uses: actions/checkout@v4
        with:
          repository: yangzongzhuan/RuoYi-Vue
          ref: springboot2
          path: ruoyi-backend

      - name: 检出 RuoYi 前端（Vue2）
        run: git clone --depth 1 https://gitcode.com/yangzongzhuan/RuoYi-Vue2.git ruoyi-ui

      # ---------- 2. 初始化数据库 ----------
      - name: 导入初始化 SQL
        run: |
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -uroot -ppassword ry-vue < ruoyi-backend/sql/ry_20260417.sql
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -uroot -ppassword ry-vue < ruoyi-backend/sql/quartz.sql
          echo "数据库初始化完成"

      # ---------- 3. 启动后端 ----------
      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: ruoyi-backend/pom.xml

      - name: 打包后端
        run: cd ruoyi-backend && mvn -B -DskipTests package

      - name: 启动后端并等待就绪
        run: |
          # RuoYi 的 logback 把日志固定写到 /home/ruoyi/logs，
          # runner 用户默认没有该目录，Logback 初始化失败会导致应用起不来
          sudo mkdir -p /home/ruoyi/logs
          sudo chown -R "$USER" /home/ruoyi

          cd ruoyi-backend
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/captchaImage; then
              echo "✅ 后端已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 后端启动超时"
          tail -100 backend.log
          exit 1

      # ---------- 4. 启动前端 ----------
      - name: 安装 Node 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: 安装前端依赖
        run: cd ruoyi-ui && npm install --legacy-peer-deps

      - name: 启动前端并等待就绪
        run: |
          cd ruoyi-ui
          # 关掉自动打开浏览器（CI 里没有图形界面）
          sed -i 's/open: true/open: false/' vue.config.js
          port=8081 nohup npm run dev > frontend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:8081/; then
              echo "✅ 前端已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 前端启动超时"
          tail -100 frontend.log
          exit 1

      # ---------- 5. 运行 UI 自动化测试 ----------
      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests-repo/requirements.txt

      - name: 安装测试依赖与浏览器
        run: |
          cd tests-repo
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 执行 UI 自动化测试
        env:
          BASE_URL: http://localhost:8081
          HEADLESS: "true"
        run: |
          cd tests-repo
          pytest --alluredir=./allure-results

      # ---------- 6. 收集产物 ----------
      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: tests-repo/allure-results
          retention-days: 7

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: tests-repo/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败时打印服务日志
        if: failure()
        run: |
          echo "===== 后端日志 ====="
          tail -80 ruoyi-backend/backend.log || true
          echo "===== 前端日志 ====="
          tail -80 ruoyi-ui/frontend.log || true
